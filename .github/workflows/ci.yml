name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Linux build deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev
      - run: cargo build --workspace --release
      # Default target selection retains example linking and library doctests.
      - run: cargo test --workspace --profile ci
      - name: Headless smoke test
        run: cargo run --release -p rabbithole -- screenshot about:home -o home.png --width 1000 --height 700
      - uses: actions/upload-artifact@v4
        with:
          name: about-home-${{ matrix.os }}
          path: home.png
