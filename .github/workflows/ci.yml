name: CI

on:
  push:
    branches: [main, "release/**", "validation/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Linux build deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev
      - id: build
        run: cargo build --workspace --release --locked
      - name: Check test evidence parser
        run: python -B -m unittest discover -s scripts/tests -p test_compare_test_runs.py -v
      # Default target selection retains example linking and library doctests.
      - id: tests_off
        name: Test interpreter with incremental GC stress
        shell: bash
        env:
          RABBITHOLE_JIT: "off"
          RH_GC_STRESS: inc
        # Native codec diagnostics can interrupt libtest lines when streams
        # are merged. Retain complete stdout for outcome comparison and stderr
        # separately; the EXIT trap also prints diagnostics on Cargo failure.
        run: |
          trap 'cat tests-off.stderr.log >&2' EXIT
          cargo test --workspace --profile ci --features jit --locked --no-fail-fast 2>tests-off.stderr.log | tee tests-off.log
      - id: tests_on
        name: Test baseline JIT with incremental GC stress
        if: always() && steps.build.outcome == 'success'
        shell: bash
        env:
          RABBITHOLE_JIT: "on"
          RABBITHOLE_JIT_THRESHOLD: "0"
          RH_GC_STRESS: inc
        run: |
          trap 'cat tests-on.stderr.log >&2' EXIT
          cargo test --workspace --profile ci --features jit --locked --no-fail-fast 2>tests-on.stderr.log | tee tests-on.log
      - name: Compare executed test results
        if: always() && steps.build.outcome == 'success'
        run: python scripts/compare-test-runs.py tests-off.log tests-on.log
      - name: Headless smoke test
        run: cargo run --release --locked -p rabbithole -- screenshot about:home -o home.png --width 1000 --height 700
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-${{ matrix.os }}-${{ github.sha }}
          path: |
            home.png
            tests-off.log
            tests-on.log
            tests-off.stderr.log
            tests-on.stderr.log
      - uses: actions/upload-artifact@v4
        if: always() && steps.build.outcome == 'success'
        with:
          name: browser-${{ matrix.os }}-${{ github.sha }}
          path: |
            target/release/rabbithole
            target/release/rabbithole.exe
            target/release/rh-wpt
            target/release/rh-wpt.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Linux'
        with:
          name: conformance-runners-${{ github.sha }}
          path: |
            target/ci/examples/wpt_reftest
            target/ci/examples/test262
            target/ci/examples/jitdiff
          if-no-files-found: warn
