name: Android JS core diagnostic

on:
  push:
    branches: ["android/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-js-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cross-compile:
    if: startsWith(github.ref, 'refs/heads/android/')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: "2"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # Rust and the Android NDK come from the runner image. The script may
      # add only rust-std for Android to that existing Rust toolchain.
      - name: Cross-compile and package without executing ARM
        env:
          ANDROID_JS_OUTPUT: ${{ runner.temp }}/android-js-artifacts
        run: python3 scripts/android-js/build-diagnostic.py
      - name: Upload binary, source, oracles and provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-js-aarch64-api21-${{ github.sha }}
          path: |
            ${{ runner.temp }}/android-js-artifacts/android-js-aarch64-api21.tar.gz
            ${{ runner.temp }}/android-js-artifacts/archive.sha256
            ${{ runner.temp }}/android-js-artifacts/commands.log
            ${{ runner.temp }}/android-js-artifacts/error.txt
            ${{ runner.temp }}/android-js-artifacts/bundle/metadata/
            ${{ runner.temp }}/android-js-artifacts/bundle/manifest.json
          if-no-files-found: error
          retention-days: 14
