<!doctype html><title>Flex bases measure unconstrained content</title>
<link rel="match" href="flex-intrinsic-main-size-ref.html">
<style>
body{margin:0}section{display:flex;width:300px;height:20px;margin-bottom:4px}
section>div{min-width:0}section>div>div{width:300px;height:20px}
.capped{max-width:100px;background:green}.other{background:blue}
aside{float:left;max-width:300px}aside section{width:auto}
.minimum{width:400px}.minimum>div{flex:1 1 content}.minimum .capped{min-width:200px;max-width:none}
.minimum .capped>div{width:80px}.minimum .other>div{width:40px}
.empty{background:green;width:100px}.empty>div{width:100px;flex-basis:0%;background:red}
</style>
<section><div class=capped><div></div></div><div class=other><div></div></div></section>
<section class=minimum><div class=capped><div></div></div><div class=other><div></div></div></section>
<section class=empty><div></div></section>
<aside><section><div class=capped><div></div></div><div class=other><div></div></div></section></aside>
