<!doctype html>
<meta charset="utf-8">
<title>WebGL1 filtering and compositing</title>
<style>
  body { margin: 24px; font: 16px sans-serif; color: #e5eaf4; background: #101827; }
  h1 { font-size: 26px; }
  canvas { width: 320px; height: 320px; border: 1px solid #65748e; }
  #status { white-space: pre-wrap; }
</style>
<h1>WebGL1 filtering and compositing</h1>
<p>A bilinear grayscale texture beneath a translucent red triangle.</p>
<canvas id="composited" width="64" height="64"></canvas>
<p id="status">Rendering…</p>
<script>
(function () {
  const status = document.getElementById('status');
  try {
    const gl = document.getElementById('composited').getContext('webgl', { preserveDrawingBuffer: true });
    if (!gl) throw new Error('WebGL1 context unavailable');
    function shader(kind, source) {
      const shader = gl.createShader(kind);
      gl.shaderSource(shader, source); gl.compileShader(shader);
      if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(shader));
      return shader;
    }
    const program = gl.createProgram();
    gl.attachShader(program, shader(gl.VERTEX_SHADER,
      'attribute vec2 position; varying vec2 uv; void main(){gl_Position=vec4(position,0.0,1.0);uv=position*0.5+vec2(0.5);}'));
    gl.attachShader(program, shader(gl.FRAGMENT_SHADER,
      'precision mediump float; uniform sampler2D image; uniform vec4 tint; varying vec2 uv; void main(){gl_FragColor=texture2D(image,uv)*tint;}'));
    gl.linkProgram(program);
    if (!gl.getProgramParameter(program, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(program));
    gl.useProgram(program);
    const buffer = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
    const position = gl.getAttribLocation(program, 'position');
    gl.vertexAttribPointer(position, 2, gl.FLOAT, false, 0, 0); gl.enableVertexAttribArray(position);
    const texture = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, texture);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 2, 2, 0, gl.RGBA, gl.UNSIGNED_BYTE,
      new Uint8Array([255,255,255,255, 0,0,0,255, 255,255,255,255, 0,0,0,255]));
    gl.uniform1i(gl.getUniformLocation(program, 'image'), 0);
    const tint = gl.getUniformLocation(program, 'tint');
    gl.uniform4f(tint, 1, 1, 1, 1);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 1, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE,
      new Uint8Array([255,255,255,255]));
    gl.enable(gl.BLEND);
    gl.blendFuncSeparate(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA, gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
    gl.uniform4f(tint, 1, 0, 0, 0.5);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-0.8,-0.8, 0.8,-0.8, 0,0.8]), gl.STATIC_DRAW);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
    const error = gl.getError();
    if (error !== gl.NO_ERROR) throw new Error('GL error: ' + error);
    status.textContent = 'Rendered bilinear filtering and alpha blending.';
  } catch (error) {
    status.textContent = 'Rendering error: ' + error.message;
    console.error(status.textContent);
  }
})();
</script>
