<!doctype html><title>Non-scrollable flex automatic minimum</title>
<link rel="match" href="flex-auto-min-overflow-ref.html">
<style>
body{margin:0}section{display:flex;width:100px;margin-bottom:4px}
section>div{overflow:clip}section>div>div{width:150px;height:20px;background:green}
.column{flex-direction:column;height:100px}.column>div>div{width:20px;height:150px}
.hidden>div{overflow:hidden}.explicit>div{min-width:0;min-height:0}
</style>
<section><div><div></div></div></section>
<section class=hidden><div><div></div></div></section>
<section class=explicit><div><div></div></div></section>
<section class=column><div><div></div></div></section>
<section class="column hidden"><div><div></div></div></section>
<section class="column explicit"><div><div></div></div></section>
