<!doctype html>
<title>GLSL token preprocessing</title>
<link rel="match" href="webgl-preprocessor-ref.html">
<style>body{margin:0}canvas{display:block}</style>
<canvas id="gl1" width="4" height="4"></canvas><canvas id="gl2" width="4" height="4"></canvas>
<script>
for (const [id, version] of [['gl1', 1], ['gl2', 2]]) {
  const gl = document.getElementById(id).getContext(version === 2 ? 'webgl2' : 'webgl', {preserveDrawingBuffer:true, premultipliedAlpha:false});
  function check(condition, message) { if (!condition) throw new Error(version + ': ' + message); }
  function compile(kind, source) {
    const shader = gl.createShader(kind); gl.shaderSource(shader, source); gl.compileShader(shader);
    check(gl.getShaderParameter(shader, gl.COMPILE_STATUS), gl.getShaderInfoLog(shader)); return shader;
  }
  const prefix = version === 2 ? '#version 300 es\n' : '';
  const vertex = prefix + `
#define PROJECT(v) vec4((v),0.0,1.0)
#if __VERSION__ >= 300
#define INPUT in
#else
#define INPUT attribute
#endif
INPUT vec2 position;
void main(){gl_Position=PROJECT(position);}
`;
  const fragment = prefix + `
precision mediump float;
#define BOOST(v) ((v)+(v))
#define VALUE 0.5
#define TINT(r,g,b) vec4((r),(g),(b),1.0)
#define SHADE TINT
#if __VERSION__ >= 300
out vec4 outputColor;
#define OUTPUT outputColor
#else
#define OUTPUT gl_FragColor
#endif
#if 0 && UNDEFINED
☃ this source is removed before GLSL validation
uniform sampler2D discarded;
#endif
#if GL_ES && defined(GL_FRAGMENT_PRECISION_HIGH)
#define COLOR SHADE(0.0,BOOST(VALUE),0.0)
#elif UNDEFINED
#error a previous branch was already selected
#else
#error missing actual fragment precision
#endif
void main(){OUTPUT=COLOR;}
`;
  const program = gl.createProgram(); gl.attachShader(program, compile(gl.VERTEX_SHADER, vertex)); gl.attachShader(program, compile(gl.FRAGMENT_SHADER, fragment)); gl.linkProgram(program);
  check(gl.getProgramParameter(program, gl.LINK_STATUS), gl.getProgramInfoLog(program)); gl.useProgram(program);
  check(gl.getProgramParameter(program, gl.ACTIVE_UNIFORMS) === 0, 'excluded sampler was reflected');
  const buffer = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buffer); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,3,-1,-1,3]), gl.STATIC_DRAW);
  const position = gl.getAttribLocation(program, 'position'); gl.vertexAttribPointer(position, 2, gl.FLOAT, false, 0, 0); gl.enableVertexAttribArray(position);
  const invalid = gl.createShader(gl.FRAGMENT_SHADER);
  gl.shaderSource(invalid, prefix + '#define BAD(x,x) x\nprecision mediump float;void main(){}'); gl.compileShader(invalid);
  check(!gl.getShaderParameter(invalid, gl.COMPILE_STATUS) && gl.getShaderInfoLog(invalid).includes('duplicate'), 'malformed macro did not fail compilation');
  check(gl.getError() === gl.NO_ERROR, 'compile failure changed GL error state');
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  const bytes = new Uint8Array(4); gl.readPixels(0, 0, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, bytes);
  check(Array.from(bytes).join(',') === '0,255,0,255', 'macro result did not reach pixels'); check(gl.getError() === gl.NO_ERROR, 'draw error');
  console.log(version, Array.from(bytes).join(','));
}
</script>
