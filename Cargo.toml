[workspace]
resolver = "2"
members = ["crates/*", "app"]

[workspace.package]
version = "0.1.6"
edition = "2021"
license = "MIT"
repository = "https://github.com/i234dev/RabbitHoleBrowser"
authors = ["i234dev"]

[workspace.dependencies]
rabbithole-dom = { path = "crates/dom" }
rabbithole-html = { path = "crates/html" }
rabbithole-css = { path = "crates/css" }
rabbithole-style = { path = "crates/style" }
rabbithole-gfx = { path = "crates/gfx" }
rabbithole-net = { path = "crates/net" }
rabbithole-layout = { path = "crates/layout" }
rabbithole-engine = { path = "crates/engine" }
rabbithole-js = { path = "crates/js" }
rabbithole-svg = { path = "crates/svg" }
rabbithole-script = { path = "crates/script" }
rabbithole-agent = { path = "crates/agent" }
rabbithole-wasm = { path = "crates/wasm" }
rabbithole-wasm-js = { path = "crates/wasm-js" }
rabbithole-media = { path = "crates/media" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true

[profile.ci]
inherits = "release"
lto = false
codegen-units = 16

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
