<!doctype html>
<meta charset="utf-8">
<title>Auto-repeat floors a definite minmax maximum by the minimum</title>
<link rel="match" href="grid-auto-repeat-minmax-floor-ref.html">
<style>
.grid { display: grid; width: 100px; margin-bottom: 10px; grid-template-rows: 50px 50px; }
.grid > div { background: green; }
#floor { grid-template-columns: repeat(auto-fill, minmax(50px, 25px)); }
#control { grid-template-columns: repeat(auto-fill, minmax(25px, 50px)); }
</style>
<div class="grid" id="floor"><div></div><div></div><div></div><div></div></div>
<div class="grid" id="control"><div></div><div></div><div></div><div></div></div>
