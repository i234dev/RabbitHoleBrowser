<!doctype html>
<title>Reference rectangles for absolute aspect ratio sizing</title>
<style>
body { margin: 0; }
div { position: absolute; top: 0; width: 100px; height: 100px; background: green; }
#width { left: 0; }
#height { left: 120px; }
#maximum { left: 240px; }
#minimum { left: 360px; }
#border { left: 480px; height: 50px; }
#center { left: 640px; top: 40px; width: 20px; height: 20px; }
</style>
<div id="width"></div><div id="height"></div><div id="maximum"></div>
<div id="minimum"></div><div id="border"></div><div id="center"></div>
