<!doctype html>
<meta charset="utf-8">
<title>Auto flex basis retrieves preferred intrinsic main sizes</title>
<link rel="match" href="flex-auto-intrinsic-main-size-ref.html">
<style>
*{font:10px/1 monospace;font-style:normal}
body{margin:8px}
section{width:300px;height:24px;display:flex;align-items:start}
i{display:block;background:green;color:white;flex:0 0 auto;min-width:0}
.min{width:min-content}.max{width:max-content}
.content{flex-basis:content}.explicit{flex-basis:50px}
.column{flex-direction:column;width:40px;height:90px}
.column i{width:40px;height:80px;min-height:0}
.column b{display:block;width:20px;height:30px}
.column .intrinsic{height:min-content}
</style>
<section><i class=min>XXXX XX</i></section>
<section style="flex-direction:row-reverse"><i class=min>XXXX XX</i></section>
<section><i class=max>XXXX XX</i></section>
<section><i class="min content">XXXX XX</i></section>
<section><i class="min explicit">XXXX XX</i></section>
<section class=column><i class=intrinsic><b></b></i></section>
<section class=column><i><b></b></i></section>
<section class=column><i class=content><b></b></i></section>
