<!doctype html>
<meta charset="utf-8">
<title>Grid lanes preserve intrinsic constraints and stretch eligibility</title>
<link rel="match" href="grid-lanes-intrinsic-constraints-ref.html">
<style>
.columns { display: grid-lanes; border: 5px solid purple; grid-template-columns: minmax(10px, 100px); margin-bottom: 10px; }
.columns .item { height: 20px; background: green; }
#min { width: min-content; }
#max { width: max-content; }
.rows { display: grid-lanes; width: 100px; height: 100px; grid-template-rows: 100px; background: green; margin-bottom: 10px; }
.rows .item { width: 100px; background: red; }
#intrinsic .item { height: max-content; }
#auto .item { height: auto; background: blue; }
</style>
<div class="columns" id="min"><div class="item"></div></div>
<div class="columns" id="max"><div class="item"></div></div>
<div class="rows" id="intrinsic"><div class="item"></div></div>
<div class="rows" id="auto"><div class="item"></div></div>
