[package]
name = "rabbithole-gfx"
description = "RabbitHole browser engine: gfx"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
fontdue = "0.9"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico"] }
miniz_oxide = "0.8"
brotli-decompressor = "4"
# Colour management (already used by `image`), AVIF container + AV1 decoder (pure Rust, no asm).
moxcms = "0.8"
avif-parse = "2"
rav1d = { version = "1.1", default-features = false, features = ["bitdepth_8", "bitdepth_16"] }
