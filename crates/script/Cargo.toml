[package]
name = "rabbithole-script"
description = "RabbitHole browser engine: web platform bindings (DOM, events, timers, fetch) for the JavaScript engine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
# Baseline JavaScript compiler (off at run time unless enabled).
jit = ["rabbithole-js/jit"]

[dependencies]
rabbithole-js.workspace = true
rabbithole-dom.workspace = true
rabbithole-html.workspace = true
rabbithole-css.workspace = true
rabbithole-style.workspace = true
rabbithole-gfx.workspace = true
rabbithole-net.workspace = true
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
rabbithole-wasm-js.workspace = true
rabbithole-media.workspace = true

rabbithole-webgl = { path = "../webgl" }
