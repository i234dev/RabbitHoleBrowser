[package]
name = "rabbithole-rtc"
description = "RabbitHole WebRTC peer and data channel transport"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
rabbithole-net.workspace = true

# Use one provider for the DTLS certificate, handshake and SRTP primitives.
[target.'cfg(not(windows))'.dependencies]
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs"] }
time = "0.3"
str0m = { version = "0.26", default-features = false, features = ["aws-lc-rs"] }

[target.'cfg(windows)'.dependencies]
x509-parser = { version = "0.18", default-features = false }
str0m = { version = "0.26", default-features = false, features = ["wincrypto"] }
