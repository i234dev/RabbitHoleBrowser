[package]
name = "rabbithole-media"
description = "RabbitHole browser engine: audio output, demuxers, decoders and the media playback pipeline"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
symphonia = { version = "0.6.1", default-features = false, features = ["mp3", "aac", "alac", "flac", "vorbis", "pcm", "adpcm", "isomp4", "mkv", "ogg", "wav", "aiff", "caf", "id3v2"] }
opus-decoder = "0.1.1"
rav1d = { version = "1.1", default-features = false, features = ["bitdepth_8", "bitdepth_16"] }
rusty_vp9 = "0.1.3"

[target.'cfg(any(unix, windows))'.dependencies]
libloading = "0.8"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Com", "Win32_System_Threading"] }
