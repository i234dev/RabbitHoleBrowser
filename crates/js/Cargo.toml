[package]
name = "rabbithole-js"
description = "RabbitHole browser engine: a JavaScript engine written from scratch (parser, bytecode compiler, VM, GC, builtins, regex)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
# Baseline x86-64 compiler (docs/jit-design.md); enabled at run time with
# RABBITHOLE_JIT=on (or the browser's --jit=on).
jit = ["dep:rabbithole-jit"]

[dependencies]
rabbithole-jit = { path = "../jit", optional = true }

[target.'cfg(all(windows, target_arch = "x86_64"))'.dev-dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Diagnostics_Debug", "Win32_System_Kernel"] }

[[example]]
name = "jitdiff"
required-features = ["jit"]
